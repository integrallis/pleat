[package]
name = "pleat"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Ribbon filters with pleated construction (a cache-sized partition before banding): about twice as fast to build at scale, verified by checksum."
license = "MIT OR Apache-2.0"
authors = ["Brian Sam-Bodden <bsb@integrallis.com>"]
repository = "https://github.com/integrallis/pleat"
documentation = "https://docs.rs/pleat"
keywords = ["ribbon-filter", "bloom-filter", "amq", "probabilistic", "filter"]
categories = ["data-structures", "algorithms"]
include = ["src/**/*.rs", "tests/vectors/*.json", "benches/*.rs", "README.md", "SECURITY.md", "PORT_NOTES.md", "LICENSE", "LICENSE-APACHE", "CHANGELOG.md"]
readme = "README.md"

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[features]
default = ["parallel"]
parallel = []  # slot-range parallel construction (uses std::thread; no extra deps)

[dev-dependencies]
criterion = "0.8"
serde_json = "1"

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "construct"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "serde"
harness = false
